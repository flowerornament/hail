name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: taiki-e/install-action@be5d41457cdd7bd9986d07500bf51a8c67803dbf # just

      - name: Install tmux and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux shellcheck

      - name: Check gate
        run: just check

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: Flake package smoke test
        run: |
          out="$(nix build --no-link --print-out-paths .)"
          "$out/bin/hail" --version
          "$out/bin/hail" --help >/dev/null
          nix run . -- --version

      - name: Home Manager module smoke test
        run: bash scripts/test-home-manager-module.sh
